[project]
name = "portfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Theodore Lehoux", email = "theodore.lehoux@2022.icam.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.160.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
portfolio = "portfolio.app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.160.0",
    "jinja2>=3.1.6",
]
